<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glaze &amp; Co. — handmade stoneware</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Gloock&display=swap">
<style>
  /* Bubble showcase: a small shop with a product grid, a cart and a chat
     button in the bottom-left, so the round switcher in the bottom-right
     shows how little room it takes. */
  :root {
    --stone: #eceee9;
    --card: #ffffff;
    --ink: #1f2420;
    --muted: #66706a;
    --clay: #b85c3c;
    --sage: #8fa58f;
    --line: #dde1db;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Outfit", "Segoe UI", Arial, sans-serif;
    background: var(--stone);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 22px 48px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    font-size: 15px;
  }
  .brand { font-family: "Gloock", Georgia, serif; font-size: 26px; margin-right: auto; }
  header a { color: inherit; text-decoration: none; }
  header a:hover, header a:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
  .cart {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font-weight: 500;
  }
  .cart span { background: var(--clay); border-radius: 999px; padding: 0 7px; font-size: 13px; }
  .intro { padding: 48px 48px 28px; display: flex; align-items: end; gap: 24px; flex-wrap: wrap; }
  .intro h1 { font-family: "Gloock", Georgia, serif; font-weight: 400; font-size: clamp(34px, 4.4vw, 56px); line-height: 1.05; margin: 0; max-width: 14em; }
  .intro p { margin: 0 0 6px auto; color: var(--muted); max-width: 26em; line-height: 1.55; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; padding: 0 48px 120px; }
  .item { background: var(--card); border-radius: 14px; padding: 16px 16px 18px; }
  .shot { aspect-ratio: 1 / 1; border-radius: 10px; display: grid; place-items: center; margin-bottom: 14px; }
  .pot { width: 54%; aspect-ratio: 1 / 1.05; border-radius: 42% 42% 36% 36% / 36% 36% 48% 48%; box-shadow: inset -14px -10px 0 rgba(0, 0, 0, .08); }
  .cup { width: 46%; aspect-ratio: 1 / .82; border-radius: 10% 10% 44% 44%; box-shadow: inset -12px -8px 0 rgba(0, 0, 0, .08); }
  .plate { width: 70%; aspect-ratio: 1 / 1; border-radius: 50%; box-shadow: inset 0 0 0 14px rgba(255, 255, 255, .35), inset -10px -8px 0 rgba(0, 0, 0, .06); }
  .vase { width: 32%; aspect-ratio: 1 / 2; border-radius: 40% 40% 30% 30% / 20% 20% 30% 30%; box-shadow: inset -10px -10px 0 rgba(0, 0, 0, .08); }
  .item h2 { font-size: 16px; font-weight: 500; margin: 0 0 4px; }
  .item p { margin: 0; color: var(--muted); font-size: 15px; }
  .chat {
    position: fixed;
    left: 24px;
    bottom: 24px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px 12px 14px;
    border-radius: 999px;
    background: var(--sage);
    color: #fff;
    font-weight: 500;
    box-shadow: 0 8px 22px rgba(31, 36, 32, .2);
  }
  .chat svg { width: 22px; height: 22px; }
  @media (max-width: 980px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) {
    header { padding: 18px 20px; gap: 16px; }
    header a.hide-s { display: none; }
    .intro, .grid { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>
  <header>
    <span class="brand">Glaze &amp; Co.</span>
    <a href="#">Shop</a>
    <a href="#" class="hide-s">Studio</a>
    <a href="#" class="hide-s">Care guide</a>
    <a class="cart" href="#">Cart <span>2</span></a>
  </header>
  <section class="intro">
    <h1>Stoneware for everyday tables</h1>
    <p>Thrown and glazed by hand in a two-person studio. Every piece is food safe and goes in the dishwasher.</p>
  </section>
  <section class="grid" aria-label="Products">
    <article class="item"><div class="shot" style="background:#e3e8df"><div class="pot" style="background:#8fa58f"></div></div><h2>Sage serving bowl</h2><p>$64</p></article>
    <article class="item"><div class="shot" style="background:#f1e3da"><div class="cup" style="background:#b85c3c"></div></div><h2>Ember mug</h2><p>$32</p></article>
    <article class="item"><div class="shot" style="background:#e4e6ec"><div class="plate" style="background:#7d8aa3"></div></div><h2>Dusk dinner plate</h2><p>$38</p></article>
    <article class="item"><div class="shot" style="background:#efe9dc"><div class="vase" style="background:#c9a96e"></div></div><h2>Wheat bud vase</h2><p>$46</p></article>
  </section>
  <a class="chat" href="#" aria-label="Chat with the studio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
    Ask us
  </a>

<!--           ConveyThis Script End         -->
</body>
</html>
